<!DOCTYPE html>
<html lang="ko">
<head>
  <title>관리자 대시보드 | 채움 클래식 필라테스</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --p-primary:   #8b7355;
      --p-secondary: #c9b99a;
      --p-light:     #f7f3ee;
      --p-dark:      #2c2c2c;
      --p-accent:    #6b5d4f;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f5f5f3;
      color: var(--p-dark);
      min-height: 100vh;
    }

    /* ── Header ── */
    .admin-header {
      background: var(--p-dark);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .brand {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.12em;
      color: #fff;
      text-decoration: none;
    }
    .brand small {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--p-secondary);
      margin-left: 10px;
      vertical-align: middle;
    }
    .btn-header {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
      padding: 6px 16px;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-header:hover { border-color: #fff; color: #fff; }

    /* ── Main ── */
    .main-wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }

    /* ── 탭 ── */
    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      border-bottom: 2px solid #e8e8e8;
    }
    .tab-nav a {
      padding: 10px 22px;
      font-size: 0.84rem;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-nav a.active { color: var(--p-primary); border-bottom-color: var(--p-primary); font-weight: 700; }
    .tab-nav a:not(.active) { color: #aaa; }

    /* ── Calendar ── */
    .cal-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .cal-nav { display: flex; align-items: center; gap: 14px; }
    .cal-title {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--p-dark);
      min-width: 140px;
      text-align: center;
    }
    .btn-nav {
      background: none;
      border: 1px solid var(--p-secondary);
      color: var(--p-primary);
      width: 34px; height: 34px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .btn-nav:hover { background: var(--p-primary); color: #fff; border-color: var(--p-primary); }

    .cal-wrap { background: #fff; border: 1px solid #e8e8e8; }
    .cal-header-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 2px solid var(--p-light);
    }
    .cal-header-row div {
      text-align: center;
      padding: 10px 4px;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      font-weight: 700;
    }
    .cal-header-row div.sat { color: #3a7bd5; }
    .cal-header-row div.sun { color: #c0392b; }

    #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-cell {
      min-height: 110px;
      border-right: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
      padding: 8px 6px 6px;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell:hover { background: #faf8f5; }
    .cal-cell.empty { cursor: default; background: #fafafa; }
    .cal-cell.today .cal-date {
      background: var(--p-primary);
      color: #fff;
      border-radius: 50%;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-cell.selected { background: #fdf6ee; }
    .cal-cell.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--p-primary);
      pointer-events: none;
    }
    .cal-date {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--p-dark);
      margin-bottom: 5px;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-cell.sat .cal-date { color: #3a7bd5; }
    .cal-cell.sun .cal-date { color: #c0392b; }
    .slot-badge {
      font-size: 0.67rem;
      background: var(--p-light);
      color: var(--p-accent);
      padding: 2px 5px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .more-badge { font-size: 0.65rem; color: #aaa; padding-left: 5px; }

    /* ── Modal ── */
    .modal-content { border-radius: 0; border: none; }
    .modal-header { background: var(--p-dark); color: #fff; border-radius: 0; }
    .modal-title { font-size: 0.9rem; letter-spacing: 0.08em; }
    .modal-header .btn-close { filter: invert(1); opacity: 0.7; }
    .modal-footer { border-top: 1px solid #f0f0f0; gap: 8px; }

    /* ── Toast ── */
    .toast-msg {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%);
      background: var(--p-dark);
      color: #fff;
      padding: 12px 28px;
      font-size: 0.84rem;
      z-index: 9999;
      animation: fadeUp 0.3s ease;
    }
    .toast-msg.error { background: #c0392b; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* ── 예약 카드 ── */
    .res-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--p-light);
      border-radius: 5px;
      margin-bottom: 6px;
      border-left: 3px solid var(--p-primary);
    }
    .res-time { font-size: 0.78rem; font-weight: 700; color: var(--p-primary); min-width: 42px; }
    .res-info { flex: 1; }
    .res-class { font-size: 0.85rem; font-weight: 600; }
    .res-customer { font-size: 0.75rem; color: #888; margin-top: 2px; }
    .badge-repeat {
      font-size: 0.62rem;
      background: rgba(139,115,85,0.12);
      color: var(--p-primary);
      padding: 1px 7px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .badge-once {
      font-size: 0.62rem;
      background: #eef2ff;
      color: #4a6fa5;
      padding: 1px 7px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .btn-del-res {
      background: none; border: none;
      color: #ccc; cursor: pointer;
      font-size: 0.9rem; padding: 0 2px; line-height: 1;
    }
    .btn-del-res:hover { color: #c0392b; }

    /* ── 예약 추가 폼 ── */
    .add-form {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e8eaed;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .add-form-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--p-primary);
      margin-bottom: 2px;
    }
    .add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .add-form input, .add-form select {
      font-size: 0.82rem;
      padding: 7px 9px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #fff;
      color: var(--p-dark);
      outline: none;
      font-family: inherit;
    }
    .add-form input:focus, .add-form select:focus { border-color: var(--p-primary); }
    .recur-range {
      display: none;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .recur-range.show { display: flex; }
    .btn-add {
      background: var(--p-primary);
      color: #fff; border: none;
      border-radius: 4px;
      padding: 8px 18px;
      font-size: 0.82rem;
      cursor: pointer;
      align-self: flex-start;
    }
    .btn-add:hover { background: var(--p-accent); }
    .btn-cancel {
      background: #fff; color: #666;
      border: 1px solid #ddd;
      padding: 9px 22px; font-size: 0.82rem; cursor: pointer;
    }
    .no-res { font-size: 0.82rem; color: #aaa; padding: 6px 0 10px; }
    .no-members-msg {
      font-size: 0.82rem; color: #e74c3c;
      padding: 8px 12px; background: #fef5f5;
      border-radius: 4px;
    }

    @media (max-width: 640px) {
      .admin-header { padding: 10px 12px; }
      .brand { font-size: 1.05rem; }
      .brand small { display: none; }
      .btn-header { padding: 5px 10px; font-size: 0.72rem; }
      .main-wrap { padding: 16px 8px 40px; }
      .tab-nav a { padding: 8px 14px; font-size: 0.78rem; }
      .cal-title { font-size: 1.1rem; min-width: 100px; }
      .cal-header-row div { padding: 7px 2px; font-size: 0.65rem; }
      .cal-cell { min-height: 64px; padding: 5px 3px 3px; }
      .slot-badge { font-size: 0.63rem; padding: 1px 3px; margin-bottom: 2px; }
      .more-badge { font-size: 0.6rem; }
      .btn-nav { width: 28px; height: 28px; font-size: 1rem; }
    }
  </style>
</head>
<body>

<header class="admin-header">
  <a href="admin.html" class="brand">채움 PILATES <small>관리자</small></a>
  <div style="display:flex; gap:8px;">
    <a href="index.html" target="_blank" class="btn-header">사이트 보기</a>
    <button class="btn-header" onclick="logout()">로그아웃</button>
  </div>
</header>

<div class="main-wrap">

  <!-- 탭 -->
  <div class="tab-nav">
    <a href="admin.html" class="active">예약 관리</a>
    <a href="members.html">회원 관리</a>
    <a href="member-reservations.html">회원별 예약관리</a>
  </div>

  <div class="cal-controls">
    <div class="cal-nav">
      <button class="btn-nav" onclick="changeMonth(-1)">&#8249;</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="btn-nav" onclick="changeMonth(1)">&#8250;</button>
    </div>
  </div>

  <div class="cal-wrap">
    <div class="cal-header-row">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div>
      <div class="sat">토</div>
    </div>
    <div id="calGrid"></div>
  </div>

</div>

<!-- ── 날짜 팝업 ── -->
<div class="modal fade" id="dayModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="dayModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:16px 20px;">
        <div id="dayModalBody"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" data-bs-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  const DAY_NAMES   = ['일','월','화','수','목','금','토'];
  const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  let currentYear, currentMonth;
  let allReservations = [];
  let activeMembers   = [];
  let selectedDateStr = null;

  const formatDate = d =>
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const escHtml = s =>
    String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ── Auth ────────────────────────────────────────────
  async function checkAuth() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) window.location.href = 'login.html';
  }
  async function logout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
  }

  // ── Toast ────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = 'toast-msg' + (type === 'error' ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  // ── 회원 로딩 ────────────────────────────────────────
  async function loadMembers() {
    const { data } = await _supabase
      .from('members').select('id, name, phone').eq('status', 'active').order('name');
    activeMembers = data || [];
  }

  // ── 데이터 로딩 ──────────────────────────────────────
  async function loadMonthData() {
    const firstStr = formatDate(new Date(currentYear, currentMonth, 1));
    const lastStr  = formatDate(new Date(currentYear, currentMonth + 1, 0));

    const { data: singleData } = await _supabase
      .from('reservations')
      .select('*, members(name, phone)')
      .eq('is_recurring', false)
      .eq('status', 'confirmed')
      .gte('reservation_date', firstStr)
      .lte('reservation_date', lastStr);

    const { data: recurData } = await _supabase
      .from('reservations')
      .select('*, members(name, phone)')
      .eq('is_recurring', true)
      .eq('status', 'confirmed')
      .lte('recurring_from', lastStr)
      .gte('recurring_until', firstStr);

    allReservations = [...(singleData || []), ...(recurData || [])];
    renderCalendar();
  }

  // 특정 날짜의 예약 필터링
  function getReservationsForDate(dateStr) {
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    return allReservations.filter(r => {
      if (!r.is_recurring) return r.reservation_date === dateStr;
      return r.day_of_week === dow &&
             r.recurring_from  <= dateStr &&
             r.recurring_until >= dateStr;
    }).sort((a, b) => a.start_time.localeCompare(b.start_time));
  }

  // ── 달력 렌더링 ──────────────────────────────────────
  function renderCalendar() {
    document.getElementById('calTitle').textContent =
      `${currentYear}년 ${MONTH_NAMES[currentMonth]}`;

    const today   = formatDate(new Date());
    const first   = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
    const offset  = first.getDay();

    let html = '';
    for (let i = 0; i < offset; i++) html += '<div class="cal-cell empty"></div>';

    for (let d = 1; d <= lastDay; d++) {
      const date    = new Date(currentYear, currentMonth, d);
      const dateStr = formatDate(date);
      const calDay  = date.getDay();
      const isToday    = dateStr === today;
      const isSelected = dateStr === selectedDateStr;

      const dayRes = getReservationsForDate(dateStr);
      let badges = '';
      dayRes.slice(0, 3).forEach(r => {
        badges += `<div class="slot-badge">${r.start_time.substring(0,5)}</div>`;
      });
      if (dayRes.length > 3) badges += `<div class="more-badge">+${dayRes.length - 3}개</div>`;

      html += `
        <div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''} ${calDay===6?'sat':''} ${calDay===0?'sun':''}"
             onclick="selectDay('${dateStr}')">
          <div class="cal-date">${d}</div>
          ${badges}
        </div>`;
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  async function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0;  currentYear++; }
    await loadMonthData();
  }

  // ── 날짜 선택 → 팝업 ─────────────────────────────────
  function selectDay(dateStr) {
    selectedDateStr = dateStr;
    renderCalendar();
    const date = new Date(dateStr + 'T00:00:00');
    const [y, m, d] = dateStr.split('-');
    document.getElementById('dayModalTitle').textContent =
      `${parseInt(y)}년 ${parseInt(m)}월 ${parseInt(d)}일 (${DAY_NAMES[date.getDay()]})`;
    renderDayModal();
    new bootstrap.Modal(document.getElementById('dayModal')).show();
  }

  // ── 시간 옵션 ────────────────────────────────────────
  function makeTimeOptions(selected) {
    let opts = '<option value="">시간 선택</option>';
    for (let h = 6; h <= 22; h++) {
      for (let m = 0; m < 60; m += 30) {
        if (h === 22 && m > 0) break;
        const t = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        opts += `<option value="${t}"${selected === t ? ' selected' : ''}>${t}</option>`;
      }
    }
    return opts;
  }

  // 회원 드롭다운 옵션
  function makeMemberOptions() {
    if (!activeMembers.length) return '<option value="">등록된 활성 회원이 없습니다</option>';
    return '<option value="">회원 선택 *</option>' +
      activeMembers.map(m =>
        `<option value="${m.id}">${escHtml(m.name)}${m.phone ? ' ('+escHtml(m.phone)+')' : ''}</option>`
      ).join('');
  }

  // ── 매주 반복 토글 ────────────────────────────────────
  function toggleRecurring() {
    const checked  = document.getElementById('seRecurring').checked;
    const rangeDiv = document.getElementById('seRecurringRange');
    if (checked) {
      rangeDiv.classList.add('show');
      document.getElementById('seRecurFrom').value = selectedDateStr;
      const until = new Date(selectedDateStr + 'T00:00:00');
      until.setMonth(until.getMonth() + 3);
      document.getElementById('seRecurUntil').value = formatDate(until);
    } else {
      rangeDiv.classList.remove('show');
    }
  }

  // ── 팝업 렌더링 ──────────────────────────────────────
  function renderDayModal() {
    const rsvs = getReservationsForDate(selectedDateStr);
    let html = '';

    if (rsvs.length) {
      rsvs.forEach(r => {
        const badge    = r.is_recurring ? '<span class="badge-repeat">매주반복</span>' : '<span class="badge-once">단일</span>';
        const mName    = r.members?.name  || '';
        const mPhone   = r.members?.phone || '';
        const customer = [mName, mPhone].filter(Boolean).join(' · ');
        html += `
          <div class="res-card">
            <span class="res-time">${r.start_time.substring(0,5)}</span>
            <div class="res-info">
              <div class="res-customer">${escHtml(customer)}${r.memo ? ' — ' + escHtml(r.memo) : ''}</div>
            </div>
            ${badge}
            <button class="btn-del-res" onclick="deleteReservation('${r.id}')" title="삭제">✕</button>
          </div>`;
      });
    } else {
      html = '<div class="no-res">이 날 예약이 없습니다.</div>';
    }

    const noMemberMsg = !activeMembers.length
      ? '<div class="no-members-msg">활성 회원이 없습니다. <a href="members.html">회원 관리</a>에서 먼저 회원을 등록해주세요.</div>'
      : '';

    html += `
      <div class="add-form">
        <div class="add-form-title">예약 추가</div>
        ${noMemberMsg}
        <div class="add-row">
          <select id="seMember" style="flex:1; min-width:160px;">${makeMemberOptions()}</select>
        </div>
        <div class="add-row">
          <select id="seTime" style="min-width:110px;">${makeTimeOptions('')}</select>
        </div>
        <input type="text" id="seMemo" placeholder="메모" style="width:100%;">
        <div>
          <label style="display:flex; align-items:center; gap:6px; font-size:0.83rem; cursor:pointer;">
            <input type="checkbox" id="seRecurring" onchange="toggleRecurring()"> 매주 반복
          </label>
          <div id="seRecurringRange" class="recur-range" style="margin-top:8px;">
            <input type="date" id="seRecurFrom">
            <span style="color:#aaa;">~</span>
            <input type="date" id="seRecurUntil">
          </div>
        </div>
        <button class="btn-add" onclick="addReservation()" ${!activeMembers.length ? 'disabled' : ''}>+ 예약 추가</button>
      </div>`;

    document.getElementById('dayModalBody').innerHTML = html;
  }

  // ── 예약 추가 ────────────────────────────────────────
  async function addReservation() {
    const memberId  = document.getElementById('seMember').value;
    const time      = document.getElementById('seTime').value;
    const memo      = document.getElementById('seMemo').value.trim();
    const isRecurring = document.getElementById('seRecurring').checked;

    if (!memberId) { showToast('회원을 선택하세요.', 'error'); return; }
    if (!time)     { showToast('시간을 선택하세요.', 'error'); return; }

    const dow = new Date(selectedDateStr + 'T00:00:00').getDay();

    const data = {
      member_id:  memberId,
      start_time: time + ':00',
      memo:         memo || null,
      status:       'confirmed',
      is_recurring: isRecurring,
    };

    if (isRecurring) {
      const from  = document.getElementById('seRecurFrom').value;
      const until = document.getElementById('seRecurUntil').value;
      if (!from || !until) { showToast('반복 기간을 입력하세요.', 'error'); return; }
      if (from > until)    { showToast('시작일이 종료일보다 늦습니다.', 'error'); return; }
      data.day_of_week    = dow;
      data.recurring_from  = from;
      data.recurring_until = until;
    } else {
      data.reservation_date = selectedDateStr;
    }

    const { error } = await _supabase.from('reservations').insert(data);
    if (error) { showToast('추가 실패: ' + error.message, 'error'); return; }

    showToast('예약이 추가되었습니다.');
    await loadMonthData();
    renderDayModal();
  }

  // ── 예약 삭제 ────────────────────────────────────────
  async function deleteReservation(id) {
    if (!confirm('이 예약을 삭제하시겠습니까?\n(매주반복의 경우 전체 일정이 삭제됩니다.)')) return;
    const { error } = await _supabase.from('reservations').delete().eq('id', id);
    if (error) { showToast('삭제 실패: ' + error.message, 'error'); return; }
    showToast('삭제되었습니다.');
    await loadMonthData();
    renderDayModal();
  }

  // ── 초기화 ──────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    await checkAuth();
    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();
    await Promise.all([loadMembers(), loadMonthData()]);
  });
</script>
</body>
</html>
