<!DOCTYPE html>
<html lang="ko">
<head>
  <title>관리자 대시보드 | 채움 클래식 필라테스</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --p-primary:   #8b7355;
      --p-secondary: #c9b99a;
      --p-light:     #f7f3ee;
      --p-dark:      #2c2c2c;
      --p-accent:    #6b5d4f;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Lato', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f5f5f3;
      color: var(--p-dark);
      min-height: 100vh;
    }

    /* ── Header ── */
    .admin-header {
      background: var(--p-dark);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      letter-spacing: 0.12em;
      color: #fff;
      text-decoration: none;
    }
    .brand small {
      font-family: 'Lato', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--p-secondary);
      margin-left: 10px;
      vertical-align: middle;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
      padding: 6px 16px;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #fff; color: #fff; }

    /* ── Main ── */
    .main-wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }

    /* ── Calendar controls ── */
    .cal-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .cal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--p-dark);
      min-width: 140px;
      text-align: center;
    }
    .btn-nav {
      background: none;
      border: 1px solid var(--p-secondary);
      color: var(--p-primary);
      width: 34px;
      height: 34px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-nav:hover { background: var(--p-primary); color: #fff; border-color: var(--p-primary); }

    /* ── Calendar grid ── */
    .cal-wrap { background: #fff; border: 1px solid #e8e8e8; }
    .cal-header-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 2px solid var(--p-light);
    }
    .cal-header-row div {
      text-align: center;
      padding: 10px 4px;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      font-weight: 700;
    }
    .cal-header-row div.sat { color: #3a7bd5; }
    .cal-header-row div.sun { color: #c0392b; }

    #calGrid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cal-cell {
      min-height: 110px;
      border-right: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
      padding: 8px 6px 6px;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell:hover { background: #faf8f5; }
    .cal-cell.empty { cursor: default; background: #fafafa; }
    .cal-cell.today .cal-date {
      background: var(--p-primary);
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-cell.selected { background: #fdf6ee; }
    .cal-cell.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--p-primary);
      pointer-events: none;
    }
    .cal-date {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--p-dark);
      margin-bottom: 5px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-cell.sat .cal-date { color: #3a7bd5; }
    .cal-cell.sun .cal-date { color: #c0392b; }

    .slot-badge {
      font-size: 0.67rem;
      background: var(--p-light);
      color: var(--p-accent);
      padding: 2px 5px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .res-dot {
      background: var(--p-primary);
      color: #fff;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      font-size: 0.6rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .more-badge {
      font-size: 0.65rem;
      color: #aaa;
      padding-left: 5px;
    }

    /* ── Buttons ── */
    .btn-add-res {
      background: transparent;
      border: 1px solid var(--p-primary);
      color: var(--p-primary);
      padding: 3px 10px;
      font-size: 0.72rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      border-radius: 3px;
    }
    .btn-add-res:hover { background: var(--p-primary); color: #fff; }
    .btn-del-small {
      background: none;
      border: none;
      color: #c0392b;
      font-size: 0.76rem;
      cursor: pointer;
      padding: 2px 6px;
      flex-shrink: 0;
    }
    .btn-del-small:hover { text-decoration: underline; }
    .btn-save {
      background: var(--p-primary);
      color: #fff;
      border: none;
      padding: 9px 22px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-save:hover { background: var(--p-accent); }
    .btn-cancel {
      background: #fff;
      color: #666;
      border: 1px solid #ddd;
      padding: 9px 22px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* ── Form elements ── */
    .form-ctrl {
      width: 100%;
      border: 1px solid #e0e0e0;
      padding: 8px 10px;
      font-size: 0.88rem;
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .form-ctrl:focus { border-color: var(--p-primary); }

    /* ── Modal ── */
    .modal-content { border-radius: 0; border: none; }
    .modal-header { background: var(--p-dark); color: #fff; border-radius: 0; }
    .modal-title { font-size: 0.9rem; letter-spacing: 0.08em; }
    .modal-header .btn-close { filter: invert(1); opacity: 0.7; }
    .modal-footer { border-top: 1px solid #f0f0f0; gap: 8px; }

    /* ── Toast ── */
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--p-dark);
      color: #fff;
      padding: 12px 28px;
      font-size: 0.84rem;
      z-index: 9999;
      animation: fadeUp 0.3s ease;
    }
    .toast-msg.error { background: #c0392b; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* ── Day modal ── */
    .day-modal-section {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--p-primary);
      margin-bottom: 10px;
    }

    .se-event-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: var(--p-light);
      border-radius: 5px;
      margin-bottom: 5px;
      border-left: 3px solid var(--p-primary);
    }
    .se-event-time { font-size: 0.78rem; font-weight: 700; color: var(--p-primary); min-width: 42px; }
    .se-event-name { flex: 1; font-size: 0.83rem; }
    .se-event-del {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 2px;
      line-height: 1;
    }
    .se-event-del:hover { color: #c0392b; }
    .se-no-events { font-size: 0.82rem; color: #aaa; padding: 6px 0 10px; }

    .badge-repeat {
      font-size: 0.62rem;
      background: rgba(139,115,85,0.12);
      color: var(--p-primary);
      padding: 1px 7px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .badge-once {
      font-size: 0.62rem;
      background: #eef2ff;
      color: #4a6fa5;
      padding: 1px 7px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .se-add-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e8eaed;
    }
    .se-add-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .se-add-form select,
    .se-add-form input[type="text"],
    .se-add-form input[type="number"],
    .se-add-form input[type="date"] {
      font-size: 0.82rem;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #fff;
      color: var(--p-dark);
      outline: none;
      font-family: inherit;
    }
    .se-add-form select:focus,
    .se-add-form input:focus { border-color: var(--p-primary); }
    .se-add-btn {
      background: var(--p-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 7px 16px;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
      align-self: flex-start;
    }
    .se-add-btn:hover { background: var(--p-accent); }

    .recur-range {
      display: none;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .recur-range.show { display: flex; }

    /* ── Reservation items ── */
    .res-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 0.86rem;
    }
    .res-item:last-child { border-bottom: none; }
    .res-phone { color: #888; margin-left: 10px; font-size: 0.8rem; }
    .res-memo  { color: #aaa; margin-left: 8px; font-size: 0.78rem; font-style: italic; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header class="admin-header">
  <a href="index.html" target="_blank" class="brand">채움 PILATES <small>관리자</small></a>
  <button class="btn-logout" onclick="logout()">로그아웃</button>
</header>

<div class="main-wrap">

  <!-- ── Calendar controls ── -->
  <div class="cal-controls">
    <div class="cal-nav">
      <button class="btn-nav" onclick="changeMonth(-1)">&#8249;</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="btn-nav" onclick="changeMonth(1)">&#8250;</button>
    </div>
  </div>

  <!-- ── Calendar ── -->
  <div class="cal-wrap">
    <div class="cal-header-row">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div>
      <div class="sat">토</div>
    </div>
    <div id="calGrid"></div>
  </div>

</div>

<!-- ── Modal: 날짜 팝업 ── -->
<div class="modal fade" id="dayModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="dayModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:16px 20px;">

        <!-- 수업 일정 -->
        <div class="day-modal-section">수업 일정</div>
        <div id="dayModalSchedule"></div>

        <hr style="margin:16px 0; border-color:#e8eaed;">

        <!-- 예약 현황 -->
        <div class="day-modal-section">예약 현황</div>
        <div id="dayModalReservations"></div>

      </div>
      <div class="modal-footer">
        <button class="btn-cancel" data-bs-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Modal: 예약 추가 ── -->
<div class="modal fade" id="resModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="resModalTitle">예약 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="resClassId">
        <div class="mb-3">
          <label class="form-label-sm" style="font-size:0.73rem;letter-spacing:0.1em;text-transform:uppercase;color:#999;display:block;margin-bottom:4px;">고객명 *</label>
          <input type="text" id="resCustomerName" class="form-ctrl">
        </div>
        <div class="mb-3">
          <label class="form-label-sm" style="font-size:0.73rem;letter-spacing:0.1em;text-transform:uppercase;color:#999;display:block;margin-bottom:4px;">연락처</label>
          <input type="tel" id="resCustomerPhone" class="form-ctrl" placeholder="010-0000-0000">
        </div>
        <div class="mb-3">
          <label class="form-label-sm" style="font-size:0.73rem;letter-spacing:0.1em;text-transform:uppercase;color:#999;display:block;margin-bottom:4px;">메모</label>
          <textarea id="resMemo" class="form-ctrl" rows="2" style="resize:vertical;"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" data-bs-dismiss="modal">취소</button>
        <button class="btn-save" onclick="saveReservation()">예약 추가</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  const DAY_NAMES   = ['일','월','화','수','목','금','토'];
  const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  let currentYear, currentMonth;
  let monthReservations = [];
  let allClasses        = [];   // 이번 달에 표시할 수업 목록
  let selectedDateStr   = null;

  const formatDate = d =>
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const escHtml = s =>
    String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ── Auth ────────────────────────────────────────────
  async function checkAuth() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) window.location.href = 'login.html';
  }
  async function logout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
  }

  // ── Toast ────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = 'toast-msg' + (type === 'error' ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  // ── 데이터 로딩 ──────────────────────────────────────
  async function loadMonthData() {
    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay  = new Date(currentYear, currentMonth + 1, 0);
    const firstStr = formatDate(firstDay);
    const lastStr  = formatDate(lastDay);

    // 예약
    const { data: resData } = await _supabase
      .from('reservations').select('*')
      .gte('reservation_date', firstStr)
      .lte('reservation_date', lastStr)
      .eq('status', 'confirmed');
    monthReservations = resData || [];

    // 단일 수업 (이번 달)
    const { data: singleData } = await _supabase
      .from('classes').select('*')
      .eq('is_recurring', false)
      .eq('is_active', true)
      .gte('class_date', firstStr)
      .lte('class_date', lastStr);

    // 반복 수업 (이번 달과 기간이 겹치는)
    const { data: recurData } = await _supabase
      .from('classes').select('*')
      .eq('is_recurring', true)
      .eq('is_active', true)
      .lte('recurring_from', lastStr)
      .gte('recurring_until', firstStr);

    allClasses = [...(singleData || []), ...(recurData || [])];
    renderCalendar();
  }

  // 특정 날짜의 수업 필터링
  function getClassesForDate(dateStr) {
    const date = new Date(dateStr + 'T00:00:00');
    const dow  = date.getDay();
    return allClasses.filter(c => {
      if (!c.is_recurring) return c.class_date === dateStr;
      return c.day_of_week === dow &&
             c.recurring_from  <= dateStr &&
             c.recurring_until >= dateStr;
    }).sort((a, b) => a.start_time.localeCompare(b.start_time));
  }

  // ── 달력 렌더링 ──────────────────────────────────────
  function renderCalendar() {
    document.getElementById('calTitle').textContent =
      `${currentYear}년 ${MONTH_NAMES[currentMonth]}`;

    const today   = formatDate(new Date());
    const first   = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
    const offset  = first.getDay(); // 일요일 시작

    let html = '';

    for (let i = 0; i < offset; i++) {
      html += '<div class="cal-cell empty"></div>';
    }

    for (let d = 1; d <= lastDay; d++) {
      const date    = new Date(currentYear, currentMonth, d);
      const dateStr = formatDate(date);
      const calDay  = date.getDay();
      const isToday    = dateStr === today;
      const isSelected = dateStr === selectedDateStr;
      const isSat = calDay === 6;
      const isSun = calDay === 0;

      const dayClasses = getClassesForDate(dateStr);
      const dayRes     = monthReservations.filter(r => r.reservation_date === dateStr);

      let badges = '';
      dayClasses.slice(0, 2).forEach(c => {
        badges += `<div class="slot-badge">${c.start_time.substring(0,5)} ${escHtml(c.class_name)}</div>`;
      });
      if (dayClasses.length > 2)
        badges += `<div class="more-badge">+${dayClasses.length - 2}개</div>`;
      if (dayRes.length)
        badges += `<div class="slot-badge"><span class="res-dot">${dayRes.length}</span> 예약</div>`;

      html += `
        <div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''} ${isSat?'sat':''} ${isSun?'sun':''}"
             onclick="selectDay('${dateStr}')">
          <div class="cal-date">${d}</div>
          ${badges}
        </div>`;
    }

    document.getElementById('calGrid').innerHTML = html;
  }

  async function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0;  currentYear++; }
    await loadMonthData();
  }

  // ── 날짜 선택 → 팝업 ─────────────────────────────────
  function selectDay(dateStr) {
    selectedDateStr = dateStr;
    renderCalendar();

    const date = new Date(dateStr + 'T00:00:00');
    const [y, m, d] = dateStr.split('-');
    document.getElementById('dayModalTitle').textContent =
      `${parseInt(y)}년 ${parseInt(m)}월 ${parseInt(d)}일 (${DAY_NAMES[date.getDay()]})`;

    renderModalSchedule();
    renderModalReservations();
    new bootstrap.Modal(document.getElementById('dayModal')).show();
  }

  // ── 시간 옵션 ────────────────────────────────────────
  function makeTimeOptions(selected) {
    let opts = '<option value="">-- 시간 선택 --</option>';
    for (let h = 6; h <= 22; h++) {
      for (let m = 0; m < 60; m += 30) {
        if (h === 22 && m > 0) break;
        const t = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        opts += `<option value="${t}"${selected === t ? ' selected' : ''}>${t}</option>`;
      }
    }
    return opts;
  }

  // ── 매주 반복 체크박스 ────────────────────────────────
  function toggleRecurring() {
    const checked   = document.getElementById('seRecurring').checked;
    const rangeDiv  = document.getElementById('seRecurringRange');
    if (checked) {
      rangeDiv.classList.add('show');
      document.getElementById('seRecurFrom').value = selectedDateStr;
      const until = new Date(selectedDateStr + 'T00:00:00');
      until.setMonth(until.getMonth() + 3);
      document.getElementById('seRecurUntil').value = formatDate(until);
    } else {
      rangeDiv.classList.remove('show');
    }
  }

  // ── 수업 일정 렌더링 ─────────────────────────────────
  function renderModalSchedule() {
    const dayClasses = getClassesForDate(selectedDateStr);
    const cont = document.getElementById('dayModalSchedule');

    let html = '';
    if (dayClasses.length) {
      dayClasses.forEach(c => {
        const typeBadge = c.is_recurring
          ? `<span class="badge-repeat">매주반복</span>`
          : `<span class="badge-once">단일</span>`;
        html += `
          <div class="se-event-item">
            <span class="se-event-time">${c.start_time.substring(0,5)}</span>
            <span class="se-event-name">${escHtml(c.class_name)}</span>
            ${typeBadge}
            <button class="btn-add-res" onclick="openResModal('${c.id}','${escHtml(c.class_name)}')">예약+</button>
            <button class="se-event-del" onclick="deleteClass('${c.id}')" title="삭제">✕</button>
          </div>`;
      });
    } else {
      html = '<div class="se-no-events">등록된 수업이 없습니다.</div>';
    }

    // 수업 추가 폼
    html += `
      <div class="se-add-form">
        <div class="se-add-row">
          <select id="seAddTime">${makeTimeOptions('')}</select>
          <input type="text" id="seAddName" placeholder="수업 이름" maxlength="30" style="flex:1; min-width:120px;"
            onkeydown="if(event.key==='Enter')addClass()">
        </div>
        <div class="se-add-row" style="align-items:flex-start; flex-wrap:wrap; gap:12px;">
          <label style="display:flex; align-items:center; gap:5px; font-size:0.83rem; cursor:pointer; margin:0;">
            <input type="checkbox" id="seRecurring" onchange="toggleRecurring()"> 매주 반복
          </label>
          <div id="seRecurringRange" class="recur-range" style="gap:6px; align-items:center;">
            <input type="date" id="seRecurFrom">
            <span style="color:#aaa; font-size:0.82rem;">~</span>
            <input type="date" id="seRecurUntil">
          </div>
        </div>
        <button class="se-add-btn" onclick="addClass()">+ 수업 추가</button>
      </div>`;

    cont.innerHTML = html;
  }

  // ── 예약 현황 렌더링 ─────────────────────────────────
  function renderModalReservations() {
    const dayRes = monthReservations.filter(r => r.reservation_date === selectedDateStr);
    const cont   = document.getElementById('dayModalReservations');
    if (!dayRes.length) {
      cont.innerHTML = '<div class="se-no-events">이 날 예약이 없습니다.</div>';
      return;
    }
    cont.innerHTML = dayRes.map(r => `
      <div class="res-item">
        <div>
          <strong>${escHtml(r.customer_name)}</strong>
          ${r.customer_phone ? `<span class="res-phone">${escHtml(r.customer_phone)}</span>` : ''}
          ${r.memo ? `<span class="res-memo">${escHtml(r.memo)}</span>` : ''}
        </div>
        <button class="btn-del-small" onclick="deleteReservation('${r.id}')">삭제</button>
      </div>`).join('');
  }

  // ── 수업 추가 ────────────────────────────────────────
  async function addClass() {
    const time     = document.getElementById('seAddTime').value;
    const name     = document.getElementById('seAddName').value.trim();
    const isRecurring = document.getElementById('seRecurring').checked;

    if (!time) { showToast('시간을 선택하세요.', 'error'); return; }
    if (!name) { showToast('수업 이름을 입력하세요.', 'error'); return; }

    const date = new Date(selectedDateStr + 'T00:00:00');
    const dow  = date.getDay();

    const classData = {
      start_time:   time + ':00',
      class_name:   name,
      is_recurring: isRecurring,
      is_active:    true,
    };

    if (isRecurring) {
      const recurFrom  = document.getElementById('seRecurFrom').value;
      const recurUntil = document.getElementById('seRecurUntil').value;
      if (!recurFrom || !recurUntil) { showToast('반복 기간을 입력하세요.', 'error'); return; }
      if (recurFrom > recurUntil)    { showToast('시작일이 종료일보다 늦습니다.', 'error'); return; }
      classData.day_of_week    = dow;
      classData.recurring_from  = recurFrom;
      classData.recurring_until = recurUntil;
    } else {
      classData.class_date = selectedDateStr;
    }

    const { error } = await _supabase.from('classes').insert(classData);
    if (error) { showToast('추가 실패: ' + error.message, 'error'); return; }

    showToast('수업이 추가되었습니다.');
    await loadMonthData();
    renderModalSchedule();
    renderModalReservations();
  }

  // ── 수업 삭제 ────────────────────────────────────────
  async function deleteClass(id) {
    const msg = '이 수업을 삭제하시겠습니까?\n(매주반복 수업의 경우 전체 일정이 삭제됩니다.)';
    if (!confirm(msg)) return;
    const { error } = await _supabase.from('classes').delete().eq('id', id);
    if (error) { showToast('삭제 실패: ' + error.message, 'error'); return; }
    showToast('삭제되었습니다.');
    await loadMonthData();
    renderModalSchedule();
  }

  // ── 예약 추가 모달 ───────────────────────────────────
  function openResModal(classId, className) {
    document.getElementById('resClassId').value         = classId;
    document.getElementById('resModalTitle').textContent = `예약 추가 — ${className}`;
    document.getElementById('resCustomerName').value    = '';
    document.getElementById('resCustomerPhone').value   = '';
    document.getElementById('resMemo').value            = '';
    new bootstrap.Modal(document.getElementById('resModal')).show();
  }

  async function saveReservation() {
    const name = document.getElementById('resCustomerName').value.trim();
    if (!name) { alert('고객명을 입력하세요.'); return; }

    const { error } = await _supabase.from('reservations').insert({
      class_id:         document.getElementById('resClassId').value,
      reservation_date: selectedDateStr,
      customer_name:    name,
      customer_phone:   document.getElementById('resCustomerPhone').value.trim() || null,
      memo:             document.getElementById('resMemo').value.trim() || null,
      status:           'confirmed',
    });

    if (error) { showToast('예약 추가 실패: ' + error.message, 'error'); return; }
    bootstrap.Modal.getInstance(document.getElementById('resModal')).hide();
    showToast('예약이 추가되었습니다.');
    await loadMonthData();
    renderModalReservations();
  }

  async function deleteReservation(id) {
    if (!confirm('이 예약을 삭제하시겠습니까?')) return;
    const { error } = await _supabase.from('reservations').delete().eq('id', id);
    if (error) { showToast('삭제 실패: ' + error.message, 'error'); return; }
    showToast('삭제되었습니다.');
    await loadMonthData();
    renderModalReservations();
  }

  // ── 초기화 ──────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    await checkAuth();
    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();
    await loadMonthData();
  });
</script>
</body>
</html>
